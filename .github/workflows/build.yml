name: build

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Docker Hub is used only once these secrets exist.
      HUB_NAME: ${{ secrets.DOCKERHUB_NAME }}
      HUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - run: cargo test --locked
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v4
        if: env.HUB_NAME != '' && env.HUB_TOKEN != ''
        with:
          username: ${{ env.HUB_NAME }}
          password: ${{ env.HUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ${{ env.HUB_NAME != '' && env.HUB_TOKEN != '' && format('{0}/photo-mover:latest', env.HUB_NAME) || '' }}
